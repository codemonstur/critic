name: Daily validate

on:
  schedule:
    - cron: '9 2 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Install Qodana CLI
        run: |
          curl -fsSL https://jb.gg/qodana-cli/install | bash -s -- v2026.2.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate
        run: |
          set -o pipefail
          make validate 2>&1 | tee validate.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # Maven Central sometimes rejects metadata requests from GitHub runners with a 403.
          # That is a network problem, not a project problem, so ignore those warnings.
          if grep -E '\[ERROR\]|\[WARNING\]' validate.log | grep -vE 'maven-metadata\.xml.*status code: 403'; then
            exit 1
          fi
